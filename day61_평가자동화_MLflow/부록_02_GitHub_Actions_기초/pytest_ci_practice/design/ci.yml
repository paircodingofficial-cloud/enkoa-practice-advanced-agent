name: ci

on:
  # TODO 1) main 브랜치에 push 할 때, 모든 pull_request, Actions 화면에서 직접 실행할 때
  #         세 이벤트마다 거를 조건이 필요한지 정합니다. 조건이 없으면 이벤트 이름 뒤를 비워 둡니다.
  push: TODO
  pull_request: TODO
  workflow_dispatch: TODO

permissions:
  contents: read

concurrency:
  # TODO 2) 같은 브랜치에 새 실행이 오면 진행 중인 이전 실행을 취소
  #         group 에는 워크플로 이름 ci 와 실행한 브랜치 github.ref 를 이어 씁니다.
  group: TODO
  cancel-in-progress: TODO

jobs:
  unit-tests:
    # TODO 3) ubuntu-latest 와 windows-latest 두 운영체제에서 같은 단계를 실행하고, 한쪽이 실패해도 다른 쪽은 끝까지 실행
    #         strategy 아래에 fail-fast 와 matrix 의 os 목록을 만들고, runs-on 에서 matrix.os 를 씁니다.
    strategy: TODO
    runs-on: TODO
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
      - name: uv 설치
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 라이브러리 설치
        run: uv sync --locked
      - name: 단위 테스트
        run: uv run pytest -v tests/test_normalize.py tests/test_check_citation.py

  gate-rules:
    # TODO 4) unit-tests 가 (두 운영체제 모두) 통과한 뒤에만 시작
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v7
      - name: uv 설치
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 라이브러리 설치
        run: uv sync --locked
      - name: 게이트 규칙 테스트
        run: uv run pytest -v tests/test_gate_rules.py --junitxml=reports/junit.xml
      # TODO 5) 앞 단계가 실패해도 실행되어 reports/ 를 산출물 gate-reports 로 7일 보관하는 단계
      #         uses: actions/upload-artifact@v7 와 with 아래 name, path, retention-days 를 씁니다.
