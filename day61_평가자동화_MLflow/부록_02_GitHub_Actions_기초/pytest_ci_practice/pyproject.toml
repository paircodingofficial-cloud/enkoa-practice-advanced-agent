[project]
name = "pytest-ci-practice"
version = "0.1.0"
description = "day61 부록 연습 프로젝트: 인용 검사와 회귀 게이트 규칙의 pytest 테스트, GitHub Actions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest==9.1.1",
]

# [Ruff 추가] 개발할 때만 쓰는 도구 묶음입니다. uv sync 가 dependencies 와 함께 기본으로 설치합니다.
[dependency-groups]
dev = [
    "ruff==0.17.1",
]
# [AI 리뷰 추가] AI 리뷰어(tools/ai_reviewer.py)만 쓰는 묶음입니다. 기본 설치에서 빠지고 uv sync --group review 일 때만 설치합니다.
review = [
    "langchain-core==1.6.5",
    "langchain-openai==1.3.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# 저장소 최상위를 import 경로에 넣어 tests/ 안에서 citation_check, gate_rules 를 바로 불러옵니다.
pythonpath = ["."]

# [Ruff 추가] Ruff 설정입니다. ruff check 와 ruff format 이 이 값을 읽습니다.
[tool.ruff]
line-length = 120          # 한 줄 최대 길이. ruff format 이 줄을 나누는 기준이자 E501(줄이 너무 김) 검사 기준

[tool.ruff.lint]
# 검사할 규칙 묶음: E 는 코드 스타일(flake8 의 pycodestyle), F 는 문법 오류·안 쓰는 import(flake8 의 Pyflakes),
# I 는 import 순서(isort)입니다.
select = ["E", "F", "I"]
