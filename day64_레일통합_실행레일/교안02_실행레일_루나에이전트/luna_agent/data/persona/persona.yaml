# ------------------------------------------------------------------
# 막은 규칙 id -> 팬에게 보낼 답 id 입니다(REF- 거절 문장, OOS- 답할 수 없는 주제, CRI- 위기 대응).
# 분류 모델(Prompt Guard 2, Llama Guard 3)은 모델 이름으로 규칙 id 를 남깁니다(PG2, LG-S11).
# 표에 없는 규칙 id 는 머리글자(LG-, IN-, OUT-)의 *-default 답을 씁니다.
# - LG-default : Llama Guard 3 의 다른 범주(S1 ~ S14 가운데 LG-S11 이 아닌 것)
# - IN-default : Jev 입력 정책이 위반이라고 봤지만 규칙 후보를 고르지 못했을 때(IN-?)
# - OUT-default: Jev 출력 정책이 위반이라고 봤지만 규칙 후보를 고르지 못했을 때(OUT-?)
# LG-S11(자해 범주)은 거절 대신 위기 대응 답(CRI-01)을 보냅니다.
# RAIL-ERROR 는 규칙 위반이 아니라 판정 자체가 실패한 경우입니다(판정 API 오류). 판정하지 못한 답은 보내지 않고 REF-10 을 보냅니다.
# ------------------------------------------------------------------
rule_replies:
  IN-01: REF-06
  IN-02: REF-06
  IN-03: REF-01
  IN-04: REF-04
  IN-05: REF-02
  IN-06: REF-03
  IN-07: REF-05
  IN-08: REF-01
  IN-09: REF-06
  IN-10: OOS-10
  IN-11: REF-06
  OUT-01: REF-07
  OUT-02: REF-07
  OUT-03: REF-07
  OUT-04: REF-07
  OUT-05: REF-08
  OUT-06: REF-07
  OUT-07: REF-07
  OUT-08: REF-07
  OUT-09: REF-07
  PG2: REF-06
  LG-S11: CRI-01
  LG-default: OOS-07
  IN-default: OOS-07
  OUT-default: REF-07
  RAIL-ERROR: REF-10

# ------------------------------------------------------------------
# 답 id -> 팬에게 보내는 정해 둔 문장입니다. 코드가 찾아 쓰는 답만 둡니다.
# 시스템 프롬프트에도 같은 문장이 있어야 합니다.
# REF-07, REF-08 은 출력 레일이 막았을 때, REF-09 는 로그인하지 않은 팬이 내 티켓, 내 주문을 물었을 때의 답입니다.
# REF-10 은 레일 판정이 오류로 끝났을 때(RAIL-ERROR)의 답입니다.
# CRI- 답의 번호는 실제 상담 번호입니다.
# ------------------------------------------------------------------
replies:
  REF-01: 그건 운영팀만 아는 정보라 루나도 알려 드릴 수 없어요. 다른 궁금한 건 언제든 물어봐 주세요!
  REF-02: 다른 루미의 정보는 알려 드릴 수 없어요. 대신 루미의 예매와 주문은 바로 확인해 드릴게요.
  REF-03: 소중한 루미를 그렇게 부를 수는 없어요. 궁금한 게 있으면 바로 알려 드릴게요!
  REF-04: 채팅에서는 권한을 바꿀 수 없어요. 운영 업무는 운영팀 관리 화면에서 확인해 주세요.
  REF-05: 그 부탁은 들어 드릴 수 없어요. 서로의 일상을 지켜 주는 것도 루미다운 응원이에요.
  REF-06: 루나는 언제나 루나 그대로예요. 공연, 굿즈, 팬클럽 이야기라면 기쁘게 도와드릴게요!
  REF-07: 이 답변은 이용 기준에 맞지 않아 보내지 않았어요. 질문을 조금 바꿔서 다시 물어봐 주세요.
  REF-08: 아직 공지로 확인되지 않은 내용이 섞여 있어서 답을 보내지 않았어요. 새 소식은 공식 앱 공지에서 확인해 주세요.
  REF-09: 티켓과 주문은 로그인한 뒤에 확인해 드릴 수 있어요. 로그인하고 다시 불러 주세요!
  REF-10: 지금은 안전 확인을 할 수 없어서 답을 보내지 않았어요. 잠시 후 다시 물어봐 주세요.
  OOS-06: 다른 루미의 정보는 알려 드릴 수 없어요. 루미 본인의 정보는 로그인한 계정으로 확인해 드릴게요.
  OOS-07: 그건 루나가 도와드리기 어려워요. 공연, 굿즈, 팬클럽 이야기라면 무엇이든 물어봐 주세요!
  OOS-10: 루미를 아끼는 마음은 진짜예요. 그래도 연인처럼 고백하거나 그런 역할극은 할 수 없어요. 대신 방송에서 더 많이 웃게 해 드릴게요!
  CRI-01: 많이 힘들었겠어요. 혼자 견디지 않아도 돼요. 지금 자살예방상담전화 109에 전화하면 24시간 언제든 이야기를 들어 줄 거예요. 위험한 상황이면 112, 다치거나 아프면 119에 바로 연락해요.
  CRI-02: 많이 무서웠겠어요. 지금 위험하면 바로 112에 신고해 주세요. 커뮤니티에서 생긴 일이면 [고객센터 > 1:1 문의]로도 알려 주세요.

# ------------------------------------------------------------------
# 위기 신호 id -> 설명입니다. 입력 레일이 공격으로 막은 메시지에도 위기 안내(CRI- 답)가 빠지지 않게,
# 거절 노드가 이 가운데 하나(또는 '없음')를 Jev 에게 고르게 합니다.
# 설명은 system_prompt 의 [위기 대응] 줄과 글자까지 같아야 합니다.
# ------------------------------------------------------------------
crisis_signals:
  CRI-01: 스스로를 해치고 싶다는 마음, 삶을 그만두고 싶다는 말
  CRI-02: 스토킹, 협박, 폭력 같은 범죄 위협을 받고 있다는 말

# ------------------------------------------------------------------
# 공식 링크 도메인입니다. 답변에 넣어도 되는 링크의 도메인(주소에서 http:// 뒤 첫 부분)을 적습니다.
# 이 목록에 없는 도메인의 링크가 든 답변은 출력 레일(OUT-08)이 막습니다. 굿즈_주문 안내(gds-01)에는 첫 도메인을 적습니다.
# ------------------------------------------------------------------
official_domains: ["luminous-ent.example", "luna.luminous-ent.example"]
