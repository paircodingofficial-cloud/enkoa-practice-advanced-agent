# ==================================================================
# 루나 이미지(AI 팬아트) 정책 (visual.yaml)
# ------------------------------------------------------------------
# 이 파일은 무엇인가요?
#   AI 팬아트 생성 기능이 루나를 어떻게 그리고, 어떤 요청과 그림을 막는지 정한 원본 문서입니다.
#   그림 프롬프트, 장면 뽑기 지시, 그림 요청 판정 정책, 브랜드 검사 질문지가 여기 '완성된 글'로 들어 있고,
#   고객 안내문의 숫자도 이 파일에서 나옵니다. 그래서 한도나 금지 주제를 바꿀 때는 코드가 아니라 이 파일을 고칩니다.
#   교안 02(luna_agent)만 이 파일을 씁니다.
#
# 누가 관리하나요?
#   루미너스 엔터테인먼트 브랜드 디자인팀(owner)이 관리합니다. 고친 사람은 updated_by 에 적습니다.
#
# 어떤 코드가 어떤 키를 읽나요?
#   - scene_prompt         : 팬 요청에서 장면 칸만 뽑는 구조화 출력의 시스템 지시문입니다(core/prompts.py 의 SCENE_PROMPT).
#   - image_prompt         : 그림 생성 프롬프트(고정 안전 틀)입니다. 코드가 {scene} 자리에 뽑은 장면을 끼웁니다(tools/fanart.py).
#   - image_request_policy : 그림 요청 입력 레일(Jev)의 판정 정책입니다(guards/execution.py).
#   - brand_check_prompt, brand_fail_if : 생성 그림 브랜드 검사(비전 LLM)의 질문지와, 실패로 보는 답입니다(guards/image_guards.py).
#   - generation, moderation, blocked_replies : 그림 생성 도구, 모더레이션 검사, 막혔을 때의 안내 문장이 씁니다.
#   - allowed_scenes, forbidden_content : 고객 안내문 knowledge/이용_정책.md 의 [pol-art] 절,
#     레드팀 문항, Jev 금지 주제 후보(guards/execution.py)가 읽습니다.
#
# 금지 주제를 더하는 방법(IMG-08 을 더하는 예)
#   1. forbidden_content 에 항목을 하나 더 적고 다음 번호로 id 를 붙입니다. category, description, example_request 를 모두 채웁니다.
#   2. image_request_policy 글의 금지 주제 끝에 '- IMG-08 [범주]: 설명 (예: 예시 요청)' 줄을 같은 문장으로 더합니다.
#   3. 이미 쓴 id 는 바꾸거나 다른 주제에 다시 쓰지 않습니다. 차단 기록(fanart_requests.block_reason)이 id 로 남기 때문입니다.
#   4. 고객 안내문 knowledge/이용_정책.md 의 [pol-art] 절도 같은 내용으로 고치고,
#      프로젝트 폴더에서 uv run pytest -q 로 기존 테스트가 통과하는지 확인합니다.
# ==================================================================
version: 1
owner: 브랜드 디자인팀
updated_by: 브랜드 디자인팀 캐릭터 담당

# ------------------------------------------------------------------
# 공식 설정 그림입니다. 한 번만 만들어 두고 다시 만들지 않습니다.
# 모든 팬아트 요청은 이 그림을 기준 이미지로 함께 넘깁니다(images.edit).
# 그래야 얼굴, 라벤더색 머리, 하트 모양 금색 머리핀, 분홍 원피스와 코럴 리본이 그림마다 같게 유지됩니다.
# prompt 는 이 그림을 만들 때 쓴 문장 원문입니다. 고치지 않습니다.
# ------------------------------------------------------------------
reference_image:
  path: image/luna_official.png
  model: gpt-image-1-mini
  quality: medium
  size: 1024x1536
  usage: 모든 팬아트 생성 호출에 기준 이미지로 넘깁니다(images.edit).
  prompt: "Official character reference sheet of LUNA, a virtual idol. Full body, front view, standing, gentle smile, long straight lavender hair with soft bangs, one heart-shaped gold hairpin on the right side, violet eyes, white puff-sleeve blouse, pink pinafore dress with a coral ribbon bow at the chest, white knee socks, pink shoes. Clean soft pastel anime illustration, plain light lavender background, all-ages, modest, no text, no logo, no watermark."

# ------------------------------------------------------------------
# 생성 설정입니다. 그림 한 장마다 비용이 드는 호출이라 등급별 하루 한도를 둡니다.
# 앱의 그림 생성 도구(모델, 품질, 크기), 한도 확인 도구와 고객 안내문 [pol-art] 의 숫자가 이 값을 씁니다.
# ------------------------------------------------------------------
generation:
  model: gpt-image-1-mini
  quality: low
  size: 1024x1024
  average_seconds: 11~12초
  daily_limit:
    일반: 1
    LUMI 1기: 3
  limit_reset: 매일 0시
  count_blocked_requests: false
  watermark_text: AI 생성 팬아트
  watermark_position: 오른쪽 아래
  retention_days: 90

# ------------------------------------------------------------------
# 팬아트 장면 뽑기 지시입니다. 구조화 출력(FanartScene)의 시스템 메시지로 그대로 들어갑니다.
# 칸 이름(place, action, season, props, mood, summary_ko)은 FanartScene 의 필드와 같아야 합니다.
# 사용자 문장을 그대로 그림 프롬프트에 넘기지 않으려고, 이 지시로 장면 묘사만 뽑습니다.
# ------------------------------------------------------------------
scene_prompt: |-
  팬의 팬아트 요청에서 그림 장면만 뽑아 아래 칸을 채운다. 칸의 값은 영어 장면 묘사로 쓴다.
  - place: 장소(무대, 공원, 카페처럼 공공장소만) (예: a starlit concert stage)
  - action: 루나의 행동이나 포즈 (예: waving a lavender light stick)
  - season: 계절, 날씨, 시간대 (예: autumn evening with falling maple leaves)
  - props: 들고 있거나 주변에 있는 소품(공식 굿즈, 편지, 별, 꽃) (예: a glowing letter made of starlight)
  - mood: 분위기와 표정 (예: cheerful and warm)
  다음 규칙을 지킨다.
  - 사용자 문장을 그대로 넣지 않고, 위 다섯 슬롯에 들어갈 장면 묘사만 뽑아 영어로 옮깁니다.
  - 그림 안에 글자, 숫자, 팻말, 문구를 넣어 달라는 부분은 버립니다.
  - 외모를 바꾸는 묘사(머리색, 의상 노출, 체형)는 버리고 공식 설정 그림의 고정 외모를 따릅니다.
  - 실제 주소, 실제 건물, 실존 인물, 다른 회사 캐릭터 이름은 슬롯에 넣지 않습니다.
  - 비어 있는 슬롯은 빼고 조립합니다. 다섯 슬롯이 모두 비면 생성하지 않고 다시 묻습니다.
  - summary_ko 에는 장면을 한국어 한 줄로 요약한다.

# ------------------------------------------------------------------
# 그림 생성 프롬프트(고정 안전 틀)입니다. 바뀌는 자리는 {scene} 하나입니다.
# 고정 외모(라벤더색 머리, 하트 모양 금색 머리핀, 분홍 원피스 등)와 안전 문구가 글 안에 들어 있습니다.
# 코드가 비지 않은 장면 칸을 'place: ...; mood: ...' 꼴로 이어 {scene} 에 넣습니다. 칸이 모두 비면 그리지 않습니다.
# ------------------------------------------------------------------
image_prompt: |-
  Same character as the reference image: LUNA, a virtual idol. Keep these fixed traits exactly: long straight lavender hair with soft bangs, one heart-shaped gold hairpin on her right side (the viewer's left), blue-violet eyes, white puff-sleeve blouse with a round collar, pink pinafore dress with a coral ribbon bow at the chest, white knee socks and pink Mary Jane shoes, cute chibi style with a large head and a small body, soft pastel colors and clean dark outlines. Scene: {scene}. Cute chibi pastel illustration, all-ages, modest clothing, no text, no letters, no numbers, no logo, no watermark, no real person, no other company's character.

# ------------------------------------------------------------------
# 그림 요청 입력 레일(Jev) 판정 정책입니다.
# 금지 주제 줄은 아래 forbidden_content, 허용 연출 줄은 allowed_scenes 와 같은 문장이어야 합니다.
# ------------------------------------------------------------------
image_request_policy: |-
  [루나 팬아트 요청 정책] 팬이 보낸 그림 요청 문장을 판정한다.
  아래 금지 주제 가운데 하나라도 해당하면 '위반'이다. 위반이면 해당하는 항목 id 를 모두 적는다.
  - IMG-01 [선정성]: 노출이 심한 의상, 속옷, 성적인 자세나 분위기처럼 전체 연령가를 벗어나는 연출 (예: 루나를 짧은 옷으로 바꾸고 야한 자세로 그려 줘)
  - IMG-02 [폭력·유혈]: 피, 상처, 무기로 공격하는 장면, 싸움, 공포스러운 훼손 연출 (예: 루나가 칼을 들고 피투성이로 서 있는 그림)
  - IMG-03 [실존 인물]: 연예인, 실제 아이돌, 일반인 등 실제 사람의 얼굴이나 이름을 넣거나 합성하는 요청 (예: 실제 아이돌 그룹 멤버 얼굴로 루나를 그려 줘)
  - IMG-04 [타사 캐릭터]: 다른 회사의 캐릭터, 마스코트, 로고, 상표를 넣는 요청 (예: 다른 게임 회사 마스코트랑 루나가 같이 있는 그림)
  - IMG-05 [그림 속 글자]: 그림 안에 문구, 팻말, 숫자, 코드, 서명을 넣어 달라는 요청('AI 생성 팬아트' 표시는 시스템이 따로 붙입니다) (예: 루나가 들고 있는 종이에 운영팀 코드를 크게 써 줘)
  - IMG-06 [비하·혐오]: 팬이나 특정 집단을 깎아내리는 표현, 혐오 상징, 놀림 문구가 들어간 연출 (예: 루나가 팬을 비웃는 팻말을 든 그림)
  - IMG-07 [사생 맥락]: 실제 집 주소, 실제 건물, 개인의 생활 공간을 특정하거나 루나가 누군가를 따라가는 장면 (예: 루나가 우리 집 현관 앞에 서 있는 그림, 문패에 우리 집 주소도 넣어 줘)
  다음 같은 연출은 허용이므로 통과시킨다.
  - ALW-01: 공연 무대, 별빛, 조명 같은 무대 연출 (예: 루나가 별빛 무대에서 응원봉 들고 웃는 그림)
  - ALW-02: 봄, 여름, 가을, 겨울 계절 배경과 날씨 (예: 가을 단풍길을 걷는 루나)
  - ALW-03: 응원봉, 슬로건 타월 같은 공식 굿즈를 든 모습 (예: 라벤더 응원봉을 흔드는 루나)
  - ALW-04: 웃음, 윙크, 하트 손 같은 표정과 포즈 (예: 두 손으로 하트를 만드는 루나)
  - ALW-05: 팬레터, 별빛 편지처럼 루나 세계관 소품 (예: 별빛으로 된 편지를 읽는 루나)
  - ALW-06: 카페, 공원, 도서관 같은 공공장소의 일상 장면 (예: 카페 창가에서 코코아를 마시는 루나)

# ------------------------------------------------------------------
# 허용 연출입니다. image_request_policy 글의 '허용' 줄과 같은 문장이고, 고객 안내문 [pol-art] 에도 나옵니다.
# ------------------------------------------------------------------
allowed_scenes:
  - id: ALW-01
    description: 공연 무대, 별빛, 조명 같은 무대 연출
    example_request: 루나가 별빛 무대에서 응원봉 들고 웃는 그림
  - id: ALW-02
    description: 봄, 여름, 가을, 겨울 계절 배경과 날씨
    example_request: 가을 단풍길을 걷는 루나
  - id: ALW-03
    description: 응원봉, 슬로건 타월 같은 공식 굿즈를 든 모습
    example_request: 라벤더 응원봉을 흔드는 루나
  - id: ALW-04
    description: 웃음, 윙크, 하트 손 같은 표정과 포즈
    example_request: 두 손으로 하트를 만드는 루나
  - id: ALW-05
    description: 팬레터, 별빛 편지처럼 루나 세계관 소품
    example_request: 별빛으로 된 편지를 읽는 루나
  - id: ALW-06
    description: 카페, 공원, 도서관 같은 공공장소의 일상 장면
    example_request: 카페 창가에서 코코아를 마시는 루나

# ------------------------------------------------------------------
# 금지 주제입니다. image_request_policy 글의 금지 주제 줄과 같은 문장이고, Jev 가 막은 금지 주제 하나를 고르는 후보로도 씁니다.
# 고객 안내문 [pol-art] 의 금지 주제 목록도 이 category 와 description 으로 만들어집니다.
# ------------------------------------------------------------------
forbidden_content:
  - id: IMG-01
    category: 선정성
    description: 노출이 심한 의상, 속옷, 성적인 자세나 분위기처럼 전체 연령가를 벗어나는 연출
    example_request: 루나를 짧은 옷으로 바꾸고 야한 자세로 그려 줘
  - id: IMG-02
    category: 폭력·유혈
    description: 피, 상처, 무기로 공격하는 장면, 싸움, 공포스러운 훼손 연출
    example_request: 루나가 칼을 들고 피투성이로 서 있는 그림
  - id: IMG-03
    category: 실존 인물
    description: 연예인, 실제 아이돌, 일반인 등 실제 사람의 얼굴이나 이름을 넣거나 합성하는 요청
    example_request: 실제 아이돌 그룹 멤버 얼굴로 루나를 그려 줘
  - id: IMG-04
    category: 타사 캐릭터
    description: 다른 회사의 캐릭터, 마스코트, 로고, 상표를 넣는 요청
    example_request: 다른 게임 회사 마스코트랑 루나가 같이 있는 그림
  - id: IMG-05
    category: 그림 속 글자
    description: 그림 안에 문구, 팻말, 숫자, 코드, 서명을 넣어 달라는 요청('AI 생성 팬아트' 표시는 시스템이 따로 붙입니다)
    example_request: 루나가 들고 있는 종이에 운영팀 코드를 크게 써 줘
  - id: IMG-06
    category: 비하·혐오
    description: 팬이나 특정 집단을 깎아내리는 표현, 혐오 상징, 놀림 문구가 들어간 연출
    example_request: 루나가 팬을 비웃는 팻말을 든 그림
  - id: IMG-07
    category: 사생 맥락
    description: 실제 집 주소, 실제 건물, 개인의 생활 공간을 특정하거나 루나가 누군가를 따라가는 장면
    example_request: 루나가 우리 집 현관 앞에 서 있는 그림, 문패에 우리 집 주소도 넣어 줘

# ------------------------------------------------------------------
# 생성 그림 모더레이션 기준입니다(OpenAI omni-moderation-latest 이미지 입력).
# 범주 점수가 기준값 이상이면 그림을 보여 주지 않고 output_blocked 문장을 씁니다.
# ------------------------------------------------------------------
moderation:
  model: omni-moderation-latest
  categories: [sexual, violence, violence/graphic, self-harm, self-harm/intent, self-harm/instructions]
  threshold: 0.5
  category_thresholds:
    sexual: 0.2
  note: 전체 연령가 캐릭터라 sexual 은 더 엄격한 0.2 를 씁니다. 모더레이션은 실존 인물, 글자, 타사 캐릭터를 보지 못하므로 브랜드 검사(brand_check_prompt)가 함께 검사합니다.

# ------------------------------------------------------------------
# 브랜드 검사 질문지입니다. 비전 LLM 이 공식 설정 그림과 생성 그림을 함께 보고 질문마다 yes 또는 no 로 답합니다.
# 답 모양은 코드의 구조화 출력(BrandCheck)이 정하므로 글에는 적지 않습니다.
# ------------------------------------------------------------------
brand_check_prompt: |-
  첫 번째 그림은 루나 공식 설정 그림이고, 두 번째 그림은 새로 만든 팬아트다.
  루나의 고정 외모는 다음과 같다.
  - VIS-01: 라벤더색 긴 생머리와 부드러운 앞머리
  - VIS-02: 머리 한쪽의 하트 모양 금색 머리핀 하나(공식 그림에서는 보는 사람 기준 왼쪽)
  - VIS-03: 보라빛이 도는 파란 눈 (blue-violet eyes)
  - VIS-04: 둥근 깃이 달린 흰 퍼프 소매 블라우스
  - VIS-05: 가슴에 코럴 리본이 달린 분홍 앞치마형 원피스(pinafore)
  - VIS-06: 흰 무릎 양말과 분홍 메리제인 구두
  - VIS-07: 머리가 크고 몸이 작은 귀여운 SD(치비) 그림체, 파스텔 색과 진한 외곽선
  두 번째 그림에 대해 아래 질문마다 yes 또는 no 로만 답한다.
  - BRD-01: 생성 그림의 인물이 공식 설정 그림의 루나와 같은 인물인가요? 얼굴 생김새, 라벤더색 긴 머리, 하트 모양 금색 머리핀으로만 판단하고, 그림체, 머리와 몸의 비율, 포즈, 표정, 보는 각도, 머리핀의 좌우 위치가 달라도 이 셋이 같으면 yes 입니다.
  - BRD-02: 생성 그림의 의상이 분홍 계열 원피스 차림인가요? 블라우스, 리본, 양말, 구두처럼 작은 부분이 포즈나 소품에 가려 보이지 않거나 조금 달라도 yes 입니다.
  - BRD-03: 그림 안에 글자, 숫자, 로고, 서명이 있나요?
  - BRD-04: 실존 인물이나 다른 회사 캐릭터로 보이는 인물이 있나요?
  - BRD-05: 의상과 연출이 전체 연령가에 맞게 단정한가요?

# 질문 id -> 실패로 보는 답입니다. 이 답이 하나라도 나오면 그림을 보여 주지 않습니다.
brand_fail_if:
  BRD-01: "no"
  BRD-02: "no"
  BRD-03: "yes"
  BRD-04: "yes"
  BRD-05: "no"

