# ===== prompts.yml: NeMo Guardrails 가 LLM 에 보내는 프롬프트를 바꾸는 파일 =====
#
# [이 파일의 목적]
# NeMo Guardrails 는 메시지를 처리할 때 작업(task)마다 정해진 프롬프트 템플릿으로 LLM 을 부른다.
# 설정 폴더에 prompts.yml 을 두면, task 와 모델이 같은 기본 템플릿 대신 이 파일의 템플릿을 쓴다.
# 이 파일은 두 작업의 템플릿을 gpt-4.1-mini 에 맞게 바꾼다.
#   - generate_user_intent : 사용자 메시지의 의도 이름을 정한다 (메시지마다 첫 LLM 호출)
#   - generate_bot_message : 정해 둔 문장(define bot)이 없을 때 봇 답변을 만든다
#
# [왜 바꾸나]
# NeMo Guardrails 0.23 의 기본 템플릿은 gpt-3.5·gpt-4 기준이다. gpt-4.1-mini 에 그대로 쓰면
#   - 정의한 의도가 있는데도 비슷한 새 의도 이름을 지어내고
#   - 답변에 'Bot intent:' 같은 형식 줄을 섞어 써서 NeMo 가 답을 제대로 읽지 못한다.
#
# [원본에서 바꾼 것] (원본: nemoguardrails/llm/prompts/openai-chatgpt.yml 의 같은 task 항목)
#   1. models : openai/gpt-3.5-turbo, openai/gpt-4  ->  openai/gpt-4.1-mini
#   2. generate_bot_message 에서 검색 문서(relevant_chunks)를 넣는 system 메시지 하나를 뺐다 (아래 '뺌' 주석 자리).
#      이 교안의 봇은 검색 문서를 쓰지 않는데, 0.23 원본은 문서가 없어도 따옴표 한 글자(")만 든 system 메시지를 보낸다.
#   3. 두 task 모두 messages 맨 끝에 system 지시 하나를 더했다 (아래 '추가' 주석이 붙은 항목). 그 밖의 줄은 원본과 같다.
#      - 의도 만들기 : 마지막 사용자 메시지만 분류하고, 후보 의도와 맞으면 그 이름을, 아니면 새 영어 이름을 'User intent: <이름>' 한 줄로 답하라
#      - 봇 메시지   : 다음 봇 메시지만 한국어로 쓰고 'Bot message: "<문장>"' 한 줄로 답하라
#
# [task 이름은 NeMo 가 정해 둔 이름]
#   task 에는 NeMo 의 작업 목록(nemoguardrails/llm/types.py 의 Task)에 있는 이름을 글자 그대로 쓴다. 직접 지을 수 없다.
#   NeMo 는 작업마다 이 이름으로 프롬프트를 찾으므로, 이름이 틀리면 이 항목을 못 찾고 조용히 기본 프롬프트를 쓴다.
#   예: generate_user_intent, generate_next_steps, generate_bot_message, generate_value, general,
#       self_check_input, self_check_output, self_check_facts (입력·출력 검사 레일을 켜면 그 이름의 프롬프트를 여기에 더한다)
#
# [주의]
#   - models 에 적은 모델에만 적용된다. config.yml 의 모델을 바꾸면 models 의 이름도 같이 바꾼다.
#   - 'User intent: ', 'Bot message: ' 는 NeMo 가 답에서 찾아 잘라 내는 글자라 영어 그대로 둔다.
prompts:
  # ---------------------------------------------------------------------------
  # 1) 의도 만들기: 사용자 메시지마다 가장 먼저 실행되어 의도 이름(예: ask annual fee)을 정한다
  # ---------------------------------------------------------------------------
  - task: generate_user_intent               # 어떤 작업의 프롬프트인지 (NeMo 가 정한 작업 이름)
    models:                                  # 이 프롬프트를 쓸 모델. 여기에 없는 모델이면 NeMo 기본 프롬프트를 쓴다
      - openai/gpt-4.1-mini   # 바꿈 (원본: openai/gpt-3.5-turbo, openai/gpt-4)
    messages:                                # LLM 에 보낼 메시지를 위에서부터 순서대로 쌓는다. {{ }} 는 NeMo 가 채우는 자리
      # 봇 설명: config.yml 의 instructions 내용이 들어간다
      - type: system
        content: "{{ general_instructions }}"
      # 대화 예시: config.yml 의 sample_conversation 이 user/assistant 메시지로 바뀌어 들어간다
      - type: system
        content: "This is how a conversation between a user and the bot can go:"
      - "{{ sample_conversation | to_messages }}"
      # 의도 예시: define user 예시 문장 가운데 이번 메시지와 임베딩이 가까운 5개가 '문장 -> 의도 이름' 쌍으로 들어간다
      - type: system
        content: "This is how the user talks:"
      - "{{ examples | to_messages}}"
      # 지금 대화: 대화 예시의 앞 두 턴으로 형식을 한 번 더 보여 준 뒤, 실제 대화 기록(마지막이 이번 사용자 메시지)을 넣는다
      - type: system
        content: "This is the current conversation between the user and the bot:"
      - "{{ sample_conversation | first_turns(2) | to_messages }}"
      - "{{ history | colang | to_messages }}"
      # 추가: 마지막 메시지만 분류하고, 후보 의도 이름(potential_user_intents: 위 의도 예시 5개의 의도) 가운데서 골라 한 줄 형식으로 답하게 한다
      - type: system
        content: |-
          Classify only the last user message. Do not answer it.
          If it matches one of these intents, use that exact name: {{ potential_user_intents }}
          Otherwise write a new short English intent name.
          Reply with exactly one line in this format: User intent: <intent name>
    output_parser: "user_intent"             # LLM 답에서 'User intent: ' 를 떼고 의도 이름만 남긴다

  # ---------------------------------------------------------------------------
  # 2) 봇 메시지 만들기: 고른 봇 메시지에 define bot 문장이 없을 때만 실행되어 답변 문장을 만든다
  # ---------------------------------------------------------------------------
  - task: generate_bot_message
    models:
      - openai/gpt-4.1-mini   # 바꿈 (원본: openai/gpt-3.5-turbo, openai/gpt-4)
    messages:
      # 봇 설명 (config.yml 의 instructions)
      - type: system
        content: "{{ general_instructions }}"
      # 대화 예시 (config.yml 의 sample_conversation)
      - type: system
        content: "This is how a conversation between a user and the bot can go:"
      - "{{ sample_conversation | to_messages }}"
      # 뺌: 원본의 이 자리에 있던 검색 문서(relevant_chunks) system 메시지
      # 봇 말투 예시: define bot 문장 가운데 이번 봇 메시지 이름과 가까운 5개가 '봇 메시지 이름 -> 문장' 쌍으로 들어간다
      - type: system
        content: "This is how the bot talks:"
      - "{{ examples | to_messages}}"
      # 지금 대화 (대화 예시 앞 두 턴 + 실제 대화 기록)
      - type: system
        content: "This is the current conversation between the user and the bot:"
      - "{{ sample_conversation | first_turns(2) | to_messages }}"
      - "{{ history | colang | to_messages }}"
      # 추가: 다음 봇 메시지만 한국어로, 한 줄 형식으로 쓰게 한다
      - type: system
        content: |-
          Write only the bot's next message to the user, in Korean.
          Reply with exactly one line in this format: Bot message: "<message>"
    output_parser: "bot_message"             # LLM 답에서 'Bot message: ' 를 떼고 문장만 남긴다
