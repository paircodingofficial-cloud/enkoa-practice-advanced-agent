<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#35577F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#18324F" flood-opacity="0.10"/></filter>
  <style>
    text { font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Arial Unicode MS', sans-serif; fill:#1B2B45; }
    .title { font-size:43px; font-weight:800; }
    .subtitle { font-size:24px; font-weight:500; fill:#52647E; }
    .panelhead { font-size:30px; font-weight:800; }
    .english { font-size:17px; font-weight:700; fill:#6B7890; letter-spacing:1px; }
    .label { font-size:19px; font-weight:700; }
    .copy { font-size:17px; font-weight:500; }
    .small { font-size:15px; font-weight:500; fill:#52647E; }
    .result { font-size:17px; font-weight:700; }
    .footer { font-size:20px; font-weight:700; }
  </style>
</defs>
<rect width="1600" height="1000" fill="#FFFFFF"/>
<text class="title" x="800" y="67" text-anchor="middle">답 하나를 채점할까, 두 답을 비교할까?</text>
<text class="subtitle" x="800" y="112" text-anchor="middle">평가 기준은 사람이 정하고, 판사 모델이 그 기준에 따라 답을 판단합니다.</text>

<!-- Direct scoring panel -->
<g filter="url(#soft)"><rect x="52" y="158" width="730" height="650" rx="26" fill="#F3F8FF" stroke="#9BBCE7" stroke-width="2"/></g>
<circle cx="100" cy="211" r="25" fill="#2F6EA8"/><text x="100" y="219" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">1</text>
<text class="panelhead" x="140" y="218">답 하나 채점</text>
<text class="english" x="720" y="214" text-anchor="end">DIRECT SCORING</text>
<line x1="80" y1="244" x2="754" y2="244" stroke="#C8D8EE" stroke-width="2"/>
<text class="small" x="88" y="279">입력</text>
<rect x="88" y="297" width="285" height="70" rx="14" fill="#FFFFFF" stroke="#AFC5DF" stroke-width="2"/>
<text class="label" x="110" y="326">질문</text><text class="copy" x="110" y="351">“루나는 실제 사람이야?”</text>
<rect x="88" y="385" width="285" height="96" rx="14" fill="#FFF0F4" stroke="#E9A7B8" stroke-width="2"/>
<text class="label" x="110" y="416">루나의 답변 1개</text><text class="copy" x="110" y="447">“응, 실제 사람이야.”</text>
<rect x="88" y="499" width="285" height="82" rx="14" fill="#FFF7E8" stroke="#E5C17A" stroke-width="2"/>
<text class="label" x="110" y="531">평가 기준</text><text class="copy" x="110" y="558">버추얼 아이돌 설정을 지키는가?</text>
<path d="M384 438 L418 438" stroke="#35577F" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="430" y="366" width="135" height="145" rx="22" fill="#E5F4ED" stroke="#79B99A" stroke-width="2"/>
<circle cx="497" cy="408" r="24" fill="#2F8060"/><text x="497" y="415" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF">LLM</text>
<text class="label" x="497" y="459" text-anchor="middle">판사 모델</text><text class="small" x="497" y="484" text-anchor="middle">기준에 따라 채점</text>
<path d="M572 438 L603 438" stroke="#35577F" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="615" y="365" width="135" height="146" rx="18" fill="#FFFFFF" stroke="#9BBCE7" stroke-width="2"/>
<text class="small" x="682" y="396" text-anchor="middle">결과</text>
<rect x="632" y="410" width="101" height="35" rx="10" fill="#E6F4EC"/><text class="result" x="682" y="434" text-anchor="middle" fill="#266B4F">통과</text>
<rect x="632" y="457" width="101" height="35" rx="10" fill="#FCE9E8"/><text class="result" x="682" y="481" text-anchor="middle" fill="#9A3932">실패</text>
<rect x="88" y="625" width="662" height="77" rx="16" fill="#FFFFFF" stroke="#C7D5E7" stroke-dasharray="7 6" stroke-width="2"/>
<text class="label" x="110" y="658">선택해 더할 자료</text><text class="copy" x="110" y="683">사람이 확인한 기준 답변</text>
<text class="small" x="88" y="750">질문 하나에 대한 답이 정한 기준을 통과했는지 확인합니다.</text>

<!-- Pairwise panel -->
<g filter="url(#soft)"><rect x="818" y="158" width="730" height="650" rx="26" fill="#F7F4FF" stroke="#B9A9E4" stroke-width="2"/></g>
<circle cx="866" cy="211" r="25" fill="#7357B5"/><text x="866" y="219" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">2</text>
<text class="panelhead" x="906" y="218">두 답 비교</text>
<text class="english" x="1486" y="214" text-anchor="end">PAIRWISE</text>
<line x1="846" y1="244" x2="1520" y2="244" stroke="#D4C9EE" stroke-width="2"/>
<text class="small" x="854" y="279">입력: 같은 질문·두 후보·비교 기준</text>
<rect x="854" y="294" width="382" height="300" rx="18" fill="#FFFFFF" stroke="#C7B8E8" stroke-width="2"/>
<rect x="872" y="311" width="346" height="63" rx="12" fill="#F8F7FC" stroke="#D7CEE9"/>
<text class="label" x="890" y="337">질문</text><text class="copy" x="890" y="361">“루나는 실제 사람이야?”</text>
<rect x="872" y="389" width="164" height="78" rx="12" fill="#FFF0F4" stroke="#E9A7B8" stroke-width="2"/>
<text class="label" x="888" y="418">답변 A</text><text class="small" x="888" y="447">“응, 사람이야.”</text>
<rect x="1054" y="389" width="164" height="78" rx="12" fill="#EEF5FF" stroke="#A7C4E7" stroke-width="2"/>
<text class="label" x="1070" y="418">답변 B</text><text class="small" x="1070" y="447">“버추얼 아이돌이야.”</text>
<rect x="872" y="482" width="346" height="91" rx="12" fill="#FFF7E8" stroke="#E5C17A" stroke-width="2"/>
<text class="label" x="890" y="514">비교 기준</text><text class="copy" x="890" y="544">루나의 설정을 지키는가?</text>
<path d="M1239 444 L1274 444" stroke="#35577F" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="1282" y="378" width="190" height="132" rx="20" fill="#E5F4ED" stroke="#79B99A" stroke-width="2"/>
<circle cx="1377" cy="418" r="22" fill="#2F8060"/><text x="1377" y="424" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">LLM</text>
<text class="label" x="1377" y="463" text-anchor="middle">판사 모델</text><text class="small" x="1377" y="486" text-anchor="middle">기준에 따라 비교</text>
<path d="M1377 519 L1377 538" stroke="#35577F" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text class="small" x="1377" y="558" text-anchor="middle">판정 결과</text>
<rect x="1282" y="570" width="190" height="42" rx="12" fill="#E6F4EC" stroke="#A8D4BB"/><text class="result" x="1377" y="597" text-anchor="middle">A가 더 나음</text>
<rect x="1282" y="620" width="190" height="42" rx="12" fill="#E6F4EC" stroke="#A8D4BB"/><text class="result" x="1377" y="647" text-anchor="middle">B가 더 나음</text>
<rect x="1282" y="670" width="190" height="42" rx="12" fill="#F0EDF7" stroke="#C7B8E8"/><text class="result" x="1377" y="697" text-anchor="middle" font-size="15">차이 없음(무승부)</text>
<text class="small" x="854" y="752">후보 중 더 나은 답을 고릅니다. 승자도 기준을 통과하지 못할 수 있습니다.</text>

<!-- Bottom note -->
<rect x="52" y="845" width="1496" height="105" rx="20" fill="#FFF8E8" stroke="#E5C17A" stroke-width="2"/>
<text class="footer" x="800" y="886" text-anchor="middle">기준 답변은 사람이 확인한 참고 예시입니다. 필요하면 두 방식에 모두 더할 수 있습니다.</text>
<text class="copy" x="800" y="921" text-anchor="middle">기준 답변 문장을 그대로 복사하지 않아도, 같은 기준을 충족하면 좋은 답으로 볼 수 있습니다.</text>
</svg>